<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碎片</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='16' fill='%23f5f0e8'/><text x='50' y='72' font-size='60' text-anchor='middle' fill='%232c2416' font-family='serif'>碎</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --paper: #f5f0e8;
    --paper-dark: #ebe4d6;
    --ink: #2c2416;
    --ink-light: #6b5d4d;
    --ink-faint: #a89880;
    --accent: #8b6914;
    --accent-light: #c4a35a;
    --shadow: rgba(44, 36, 22, 0.08);
    --red: #9e3a26;
  }

  html {
    font-size: 16px;
    -webkit-font-smoothing: antialiased;
    height: 100%;
  }

  body {
    font-family: 'Noto Serif SC', 'Songti SC', 'SimSun', Georgia, serif;
    background-color: var(--paper);
    color: var(--ink);
    height: 100%;
    line-height: 1.8;
    display: flex;
    background-image:
      radial-gradient(ellipse at 20% 50%, rgba(139,105,20,0.03) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(139,105,20,0.02) 0%, transparent 50%),
      url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100' height='100' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
  }

  ::selection {
    background: var(--accent-light);
    color: var(--paper);
  }

  /* ── 左侧输入面板 ── */
  .left-panel {
    flex-shrink: 0;
    width: 320px;
    display: flex;
    flex-direction: column;
    padding: 2.5rem 2rem;
    border-right: 1px solid rgba(168,152,128,0.15);
  }

  header {
    margin-bottom: 2rem;
    padding-bottom: 1.5rem;
    border-bottom: 1px solid rgba(168,152,128,0.15);
    position: relative;
  }

  header::after {
    content: '◆';
    position: absolute;
    bottom: -0.6em;
    left: 50%;
    transform: translateX(-50%);
    background: var(--paper);
    padding: 0 1em;
    color: var(--ink-faint);
    font-size: 0.6rem;
    letter-spacing: 0.5em;
  }

  h1 {
    font-weight: 300;
    font-size: 1.6rem;
    letter-spacing: 0.3em;
    color: var(--ink);
    margin-bottom: 0.3rem;
    text-align: center;
  }

  .subtitle {
    font-size: 0.75rem;
    color: var(--ink-faint);
    letter-spacing: 0.2em;
    font-weight: 300;
    text-align: center;
  }

  .input-section {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .input-wrapper {
    flex: 1;
    position: relative;
    background: rgba(255,255,255,0.5);
    border: 1px solid rgba(168,152,128,0.2);
    border-radius: 4px;
    box-shadow: 0 1px 6px rgba(44,36,22,0.03);
    transition: border-color 0.3s, box-shadow 0.3s;
    display: flex;
    flex-direction: column;
  }

  .input-wrapper:focus-within {
    border-color: rgba(139,105,20,0.3);
    box-shadow: 0 2px 16px rgba(44,36,22,0.06);
  }

  textarea {
    flex: 1;
    width: 100%;
    padding: 1rem 1.2rem;
    border: none;
    background: transparent;
    font-family: inherit;
    font-size: 0.9rem;
    line-height: 1.8;
    color: var(--ink);
    resize: none;
    outline: none;
    min-height: 120px;
  }

  textarea::placeholder {
    color: var(--ink-faint);
    font-weight: 300;
  }

  .input-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 1rem 0.7rem;
  }

  .input-hint {
    font-size: 0.65rem;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
    opacity: 0.6;
  }

  .btn-submit {
    font-family: inherit;
    font-size: 0.82rem;
    letter-spacing: 0.12em;
    padding: 0.5rem 1.6rem;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 400;
  }

  .btn-submit:hover {
    background: var(--accent);
  }

  .btn-submit:active {
    transform: scale(0.98);
  }

  .left-footer {
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid rgba(168,152,128,0.12);
    text-align: center;
    font-size: 0.65rem;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    opacity: 0.5;
  }

  /* ── 右侧展示区 ── */
  .right-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── 页签栏 ── */
  .tabs-header {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    padding: 0.8rem 2rem 0;
    border-bottom: 1px solid rgba(168,152,128,0.15);
  }

  .tabs-container {
    display: flex;
    gap: 0.3rem;
    flex: 1;
    overflow-x: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
  }

  .tabs-container::-webkit-scrollbar {
    display: none;
  }

  .tab-item {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 0.5rem 1rem;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
    position: relative;
  }

  .tab-item:hover {
    color: var(--ink-light);
    background: rgba(168,152,128,0.05);
  }

  .tab-item.active {
    color: var(--ink);
    border-bottom-color: var(--accent);
  }

  .tab-item .tab-delete {
    display: none;
    position: absolute;
    top: 2px;
    right: 2px;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    background: var(--red);
    color: var(--paper);
    border: none;
    font-size: 0.5rem;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    line-height: 1;
  }

  .tab-item:hover .tab-delete {
    display: flex;
  }

  .btn-add-tab {
    font-family: inherit;
    font-size: 1rem;
    width: 28px;
    height: 28px;
    background: none;
    border: 1px dashed rgba(168,152,128,0.3);
    border-radius: 4px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-left: 0.5rem;
  }

  .btn-add-tab:hover {
    border-color: rgba(139,105,20,0.4);
    color: var(--accent);
    background: rgba(139,105,20,0.05);
  }

  .btn-settings {
    font-family: inherit;
    font-size: 0.9rem;
    width: 28px;
    height: 28px;
    background: none;
    border: 1px dashed rgba(168,152,128,0.3);
    border-radius: 4px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-left: 0.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-settings:hover {
    border-color: rgba(139,105,20,0.4);
    color: var(--accent);
    background: rgba(139,105,20,0.05);
  }

  .btn-ai {
    font-family: inherit;
    font-size: 0.9rem;
    width: 28px;
    height: 28px;
    background: none;
    border: 1px dashed rgba(168,152,128,0.3);
    border-radius: 4px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    margin-left: 0.3rem;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-ai:hover {
    border-color: rgba(139,105,20,0.4);
    color: var(--accent);
    background: rgba(139,105,20,0.05);
  }

  .btn-ai.loading {
    animation: aiPulse 1s ease-in-out infinite;
  }

  @keyframes aiPulse {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }

  .display-title-row {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    flex: 1;
    min-width: 0;
  }

  .ai-text {
    font-size: 0.8rem;
    color: var(--accent);
    letter-spacing: 0.08em;
    font-weight: 300;
    font-style: italic;
    flex: 1;
    min-width: 0;
    line-height: 1.6;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    transition: opacity 0.3s;
  }

  .ai-text.loading {
    opacity: 0.4;
  }

  .ai-toggle {
    position: relative;
    width: 28px;
    height: 16px;
    flex-shrink: 0;
  }

  .ai-toggle input {
    opacity: 0;
    width: 0;
    height: 0;
  }

  .ai-toggle-slider {
    position: absolute;
    cursor: pointer;
    inset: 0;
    background: rgba(168,152,128,0.25);
    border-radius: 8px;
    transition: all 0.3s;
  }

  .ai-toggle-slider::before {
    content: '';
    position: absolute;
    height: 12px;
    width: 12px;
    left: 2px;
    bottom: 2px;
    background: white;
    border-radius: 50%;
    transition: transform 0.3s;
  }

  .ai-toggle input:checked + .ai-toggle-slider {
    background: var(--accent);
  }

  .ai-toggle input:checked + .ai-toggle-slider::before {
    transform: translateX(12px);
  }

  .btn-ai-regen {
    font-family: inherit;
    font-size: 0.9rem;
    width: 28px;
    height: 28px;
    background: none;
    border: none;
    border-radius: 4px;
    color: var(--ink-faint);
    cursor: pointer;
    transition: all 0.2s;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .btn-ai-regen:hover {
    color: var(--accent);
    background: rgba(139,105,20,0.05);
  }

  .btn-ai-regen.loading {
    animation: aiPulse 1s ease-in-out infinite;
  }

  .display-title {
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    color: var(--ink-faint);
    font-weight: 300;
  }

  .settings-ai-section {
    margin-top: 1.5rem;
    padding-top: 1.2rem;
    border-top: 1px solid rgba(168,152,128,0.12);
  }

  .settings-ai-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 0.8rem;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(168,152,128,0.1);
    border-radius: 4px;
    margin-bottom: 0.5rem;
  }

  .settings-ai-label {
    font-size: 0.82rem;
    color: var(--ink);
    letter-spacing: 0.05em;
  }

  /* ── 设置面板 ── */
  .settings-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44,36,22,0.25);
    z-index: 90;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }

  .settings-overlay.show { opacity: 1; visibility: visible; }

  .settings-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 360px;
    max-width: 90vw;
    height: 100%;
    background: var(--paper);
    z-index: 95;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -4px 0 24px rgba(44,36,22,0.1);
  }

  .settings-panel.show { transform: translateX(0); }

  .settings-header {
    flex-shrink: 0;
    padding: 1.8rem 1.5rem 1.2rem;
    border-bottom: 1px solid rgba(168,152,128,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .settings-title {
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    font-weight: 300;
    color: var(--ink);
  }

  .settings-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--ink-faint);
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    transition: all 0.2s;
    font-family: inherit;
  }

  .settings-close:hover { color: var(--ink); background: rgba(168,152,128,0.1); }

  .settings-body {
    flex: 1;
    overflow-y: auto;
    padding: 1.2rem 1.5rem;
  }

  .settings-section-title {
    font-size: 0.72rem;
    color: var(--ink-faint);
    letter-spacing: 0.12em;
    margin-bottom: 0.8rem;
    font-weight: 400;
  }

  .settings-category-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.6rem 0.8rem;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(168,152,128,0.1);
    border-radius: 4px;
    margin-bottom: 0.5rem;
    transition: all 0.2s;
  }

  .settings-category-item:hover {
    background: rgba(255,255,255,0.55);
    border-color: rgba(168,152,128,0.2);
  }

  .settings-category-name {
    font-size: 0.82rem;
    color: var(--ink);
    letter-spacing: 0.05em;
  }

  .settings-category-count {
    font-size: 0.68rem;
    color: var(--ink-faint);
    margin-left: 0.5rem;
  }

  .settings-category-delete {
    font-family: inherit;
    font-size: 0.68rem;
    background: none;
    border: 1px solid rgba(158,58,38,0.2);
    color: var(--red);
    padding: 0.2rem 0.6rem;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.7;
  }

  .settings-category-delete:hover {
    background: rgba(158,58,38,0.08);
    border-color: rgba(158,58,38,0.4);
    opacity: 1;
  }

  .settings-empty {
    text-align: center;
    padding: 2rem 1rem;
    color: var(--ink-faint);
    font-size: 0.78rem;
    letter-spacing: 0.1em;
  }

  /* ── 删除分类确认弹窗 ── */
  .delete-cat-dialog {
    position: fixed;
    inset: 0;
    z-index: 210;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s;
  }

  .delete-cat-dialog.show { opacity: 1; visibility: visible; }

  .delete-cat-dialog .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(44,36,22,0.3);
  }

  .delete-cat-dialog .dialog-box {
    position: relative;
    background: var(--paper);
    border: 1px solid rgba(168,152,128,0.2);
    border-radius: 6px;
    padding: 2rem 2.2rem;
    box-shadow: 0 8px 32px rgba(44,36,22,0.15);
    text-align: center;
    max-width: 360px;
    transform: scale(0.95);
    transition: transform 0.2s;
  }

  .delete-cat-dialog.show .dialog-box { transform: scale(1); }

  .delete-cat-dialog p {
    font-size: 0.85rem;
    color: var(--ink);
    margin-bottom: 0.6rem;
    letter-spacing: 0.05em;
    line-height: 1.8;
  }

  .delete-cat-dialog .dialog-sub {
    font-size: 0.75rem;
    color: var(--ink-faint);
    margin-bottom: 1.5rem;
  }

  .delete-cat-actions {
    display: flex;
    flex-direction: column;
    gap: 0.6rem;
  }

  .btn-keep {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    padding: 0.5rem 1.2rem;
    background: var(--accent);
    border: none;
    color: var(--paper);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-keep:hover { opacity: 0.85; }

  .btn-delete-all {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    padding: 0.5rem 1.2rem;
    background: none;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-delete-all:hover { background: var(--red); color: var(--paper); }

  .btn-cancel-cat {
    font-family: inherit;
    font-size: 0.72rem;
    letter-spacing: 0.1em;
    padding: 0.4rem 1rem;
    background: none;
    border: 1px solid rgba(168,152,128,0.3);
    color: var(--ink-faint);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-cancel-cat:hover { border-color: rgba(168,152,128,0.5); background: rgba(168,152,128,0.05); }

  .tab-input {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 0.5rem 0.8rem;
    border: 1px solid rgba(139,105,20,0.3);
    border-radius: 4px;
    background: rgba(255,255,255,0.6);
    color: var(--ink);
    outline: none;
    width: 120px;
    transition: border-color 0.2s;
  }

  .tab-input:focus {
    border-color: rgba(139,105,20,0.5);
  }

  .tab-rename-input {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.08em;
    padding: 0.2rem 0.5rem;
    border: 1px solid rgba(139,105,20,0.3);
    border-radius: 3px;
    background: rgba(255,255,255,0.8);
    color: var(--ink);
    outline: none;
    width: 80px;
  }

  .display-header {
    flex-shrink: 0;
    padding: 1.5rem 2rem 0.8rem;
  }

  .display-header-top {
    display: flex;
    align-items: center;
    gap: 1rem;
  }

  .display-title {
    font-size: 0.8rem;
    color: var(--ink-faint);
    letter-spacing: 0.15em;
    font-weight: 300;
  }

  .filter-bar {
    display: flex;
    gap: 0.5rem;
    align-items: center;
    flex-shrink: 0;
  }

  .search-input {
    width: 120px;
    font-family: inherit;
    font-size: 0.78rem;
    padding: 0.4rem 0.8rem;
    border: 1px solid rgba(168,152,128,0.2);
    border-radius: 4px;
    background: rgba(255,255,255,0.5);
    color: var(--ink);
    outline: none;
    transition: border-color 0.2s, width 0.2s;
    letter-spacing: 0.05em;
  }

  .search-input:focus {
    border-color: rgba(139,105,20,0.3);
    width: 180px;
  }

  .search-input::placeholder {
    color: var(--ink-faint);
    font-weight: 300;
  }

  .stats {
    font-size: 0.72rem;
    color: var(--ink-faint);
    letter-spacing: 0.08em;
    white-space: nowrap;
  }

  .filter-colors {
    display: flex;
    gap: 4px;
    align-items: center;
  }

  .filter-color-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1.5px solid rgba(168,152,128,0.25);
    cursor: pointer;
    transition: transform 0.2s, border-color 0.2s, opacity 0.2s;
    opacity: 0.5;
    padding: 0;
  }

  .filter-color-dot:hover { transform: scale(1.3); opacity: 0.8; }
  .filter-color-dot.active { border-color: var(--ink-light); opacity: 1; transform: scale(1.2); }
  .filter-color-dot.filter-all {
    width: 10px;
    height: 10px;
    background: none;
    border: 1.5px dashed rgba(168,152,128,0.35);
  }
  .filter-color-dot.filter-all.active { border-color: var(--ink-light); border-style: solid; }

  .display-area {
    flex: 1;
    overflow-y: auto;
    padding: 0 2rem 2rem;
  }

  .display-area::-webkit-scrollbar {
    width: 4px;
  }

  .display-area::-webkit-scrollbar-track {
    background: transparent;
  }

  .display-area::-webkit-scrollbar-thumb {
    background: rgba(168,152,128,0.2);
    border-radius: 2px;
  }

  /* ── 碎片卡片 ── */
  .fragments-list {
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .fragment-card {
    position: relative;
    background: rgba(255,255,255,0.4);
    border: 1px solid rgba(168,152,128,0.12);
    padding: 1.2rem 1.5rem;
    border-radius: 4px;
    box-shadow: 0 1px 4px rgba(44,36,22,0.02);
    transition: all 0.35s ease;
    animation: fadeUp 0.4s ease both;
    cursor: pointer;
    -webkit-user-select: none;
    user-select: none;
  }

  .fragment-card:hover {
    border-color: rgba(168,152,128,0.25);
    box-shadow: 0 3px 16px rgba(44,36,22,0.05);
  }

  .fragment-card:nth-child(odd) { transform: rotate(-0.15deg); }
  .fragment-card:nth-child(even) { transform: rotate(0.1deg); }
  .fragment-card:nth-child(3n) { transform: rotate(-0.08deg); }
  .fragment-card:hover { transform: rotate(0deg) !important; }

  /* ── 颜色圆点 ── */
  .color-dots {
    position: absolute;
    left: -4px;
    top: 50%;
    transform: translateY(-50%);
    display: flex;
    flex-direction: column;
    gap: 5px;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .fragment-card:hover .color-dots { opacity: 0.6; }
  .color-dots:hover { opacity: 1 !important; }

  .color-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 1.5px solid rgba(168,152,128,0.3);
    cursor: pointer;
    padding: 0;
    transition: transform 0.2s, border-color 0.2s;
  }

  .color-dot:hover { transform: scale(1.4); }
  .color-dot.active { border-color: var(--ink-light); }

  /* ── 拖拽状态 ── */
  .fragment-card.dragging {
    opacity: 0.85;
    box-shadow: 0 8px 32px rgba(44,36,22,0.15);
    transform: rotate(0deg) scale(1.02) !important;
    transition: none;
    cursor: grabbing;
  }

  .fragment-card.drop-before {
    margin-top: 2.2rem;
    transition: margin 0.2s ease;
  }

  .fragment-card.drop-after {
    margin-bottom: 2.2rem;
    transition: margin 0.2s ease;
  }

  .fragment-content {
    font-size: 0.92rem;
    line-height: 1.9;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 0.5rem;
    -webkit-user-select: text;
    user-select: text;
  }

  .fragment-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.68rem;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
  }

  .fragment-time {
    font-variant-numeric: tabular-nums;
  }

  .fragment-actions {
    display: flex;
    gap: 0.15rem;
    align-items: center;
    position: relative;
  }

  .btn-copy {
    opacity: 0;
    font-family: inherit;
    font-size: 0.68rem;
    background: none;
    border: none;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: opacity 0.3s, background 0.2s;
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
  }

  .btn-edit, .btn-save {
    opacity: 0;
    font-family: inherit;
    font-size: 0.68rem;
    background: none;
    border: none;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: opacity 0.3s, background 0.2s;
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    color: var(--accent);
  }

  .btn-edit:hover, .btn-save:hover { background: rgba(139,105,20,0.08); }

  .fragment-card:hover .btn-edit {
    opacity: 0.6;
  }

  .fragment-card.editing .btn-save {
    opacity: 0.6;
  }

  .btn-edit:hover, .btn-save:hover {
    opacity: 1 !important;
  }

  /* ── 编辑态 ── */
  .fragment-card.editing {
    cursor: default;
    border-color: rgba(139,105,20,0.25);
    box-shadow: 0 2px 12px rgba(44,36,22,0.06);
    transform: rotate(0deg) !important;
  }

  .edit-textarea {
    width: 100%;
    min-height: 80px;
    padding: 0.6rem 0.8rem;
    border: 1px solid rgba(139,105,20,0.2);
    border-radius: 4px;
    background: rgba(255,255,255,0.6);
    font-family: inherit;
    font-size: 0.92rem;
    line-height: 1.9;
    color: var(--ink);
    resize: vertical;
    outline: none;
    margin-bottom: 0.5rem;
    transition: border-color 0.2s;
  }

  .edit-textarea:focus {
    border-color: rgba(139,105,20,0.4);
  }

  .btn-category {
    opacity: 0;
    font-family: inherit;
    font-size: 0.68rem;
    background: none;
    border: none;
    cursor: pointer;
    letter-spacing: 0.08em;
    transition: opacity 0.3s, background 0.2s;
    padding: 0.15rem 0.45rem;
    border-radius: 3px;
    color: var(--accent);
  }

  .fragment-card:hover .btn-category { opacity: 0.6; }
  .btn-category:hover { opacity: 1 !important; background: rgba(139,105,20,0.08); }

  .category-dropdown {
    position: absolute;
    right: 0;
    top: calc(100% + 4px);
    background: #f5f0e8;
    border: 1px solid rgba(168,152,128,0.2);
    border-radius: 4px;
    box-shadow: 0 4px 12px rgba(44,36,22,0.1);
    min-width: 100px;
    max-width: 160px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px) scale(0.98);
    transition: all 0.2s ease;
    z-index: 20;
    overflow: hidden;
    pointer-events: none;
  }

  .category-dropdown.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
    pointer-events: auto;
  }

  .category-dropdown-item {
    display: block;
    width: 100%;
    padding: 0.4rem 0.8rem;
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
    color: var(--ink-light);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .category-dropdown-item:hover {
    background: rgba(139,105,20,0.06);
  }

  .category-dropdown-item.active {
    color: var(--accent);
    font-weight: 600;
  }

  .fragment-category-tag {
    font-size: 0.65rem;
    color: var(--accent);
    background: rgba(139,105,20,0.06);
    padding: 0.1rem 0.45rem;
    border-radius: 3px;
    letter-spacing: 0.05em;
  }

  /* ── 下拉菜单 ── */
  .dropdown-trigger {
    opacity: 0;
    background: none;
    border: none;
    cursor: pointer;
    padding: 0.15rem 0.2rem;
    font-size: 0.5rem;
    color: var(--ink-faint);
    transition: opacity 0.3s, color 0.2s;
    line-height: 1;
    font-family: inherit;
  }

  .fragment-card:hover .dropdown-trigger {
    opacity: 0.5;
  }

  .dropdown-trigger:hover {
    opacity: 1 !important;
    color: var(--ink-light);
  }

  .dropdown-menu {
    position: absolute;
    right: 0;
    top: calc(100% + 4px);
    background: var(--paper);
    border: 1px solid rgba(168,152,128,0.2);
    border-radius: 4px;
    box-shadow: 0 4px 12px rgba(44,36,22,0.1);
    min-width: 64px;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-4px) scale(0.98);
    transition: all 0.2s ease;
    z-index: 10;
    overflow: hidden;
  }

  .dropdown-menu.show {
    opacity: 1;
    visibility: visible;
    transform: translateY(0) scale(1);
  }

  .dropdown-item {
    display: block;
    width: 100%;
    padding: 0.4rem 0.8rem;
    font-family: inherit;
    font-size: 0.7rem;
    letter-spacing: 0.08em;
    background: none;
    border: none;
    cursor: pointer;
    text-align: left;
    transition: background 0.15s;
    color: var(--red);
  }

  .dropdown-item:hover {
    background: rgba(158,58,38,0.06);
  }

  /* ── 空状态 ── */
  .empty-state {
    text-align: center;
    padding: 6rem 1rem;
    color: var(--ink-faint);
  }

  .empty-state .icon {
    font-size: 1.6rem;
    margin-bottom: 0.8rem;
    opacity: 0.25;
  }

  .empty-state p {
    font-size: 0.82rem;
    letter-spacing: 0.1em;
    font-weight: 300;
  }

  /* ── 动画 ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; }
  }

  .fragment-card.removing {
    animation: fadeOut 0.25s ease forwards;
  }

  @keyframes fadeOut {
    to { opacity: 0; transform: translateY(-6px) scale(0.98); }
  }

  /* ── toast ── */
  .toast {
    position: fixed;
    bottom: 2rem;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--ink);
    color: var(--paper);
    padding: 0.5rem 1.4rem;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    border-radius: 4px;
    opacity: 0;
    transition: all 0.35s ease;
    pointer-events: none;
    z-index: 100;
    font-family: inherit;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── 回收站按钮 ── */
  .trash-btn {
    position: fixed;
    bottom: 2rem;
    right: 2rem;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--paper);
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 12px rgba(44,36,22,0.15);
    transition: all 0.3s ease;
    opacity: 0.5;
    z-index: 50;
  }

  .trash-btn:hover {
    opacity: 1;
    transform: scale(1.08);
    background: var(--accent);
  }

  .trash-btn .badge {
    position: absolute;
    top: -4px;
    right: -4px;
    background: var(--red);
    color: var(--paper);
    font-size: 0.6rem;
    min-width: 18px;
    height: 18px;
    border-radius: 9px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: inherit;
    letter-spacing: 0;
    opacity: 0;
    transform: scale(0.5);
    transition: all 0.25s ease;
  }

  .trash-btn .badge.show {
    opacity: 1;
    transform: scale(1);
  }

  /* ── 回收站遮罩 ── */
  .trash-overlay {
    position: fixed;
    inset: 0;
    background: rgba(44,36,22,0.25);
    z-index: 90;
    opacity: 0;
    visibility: hidden;
    transition: all 0.3s ease;
  }

  .trash-overlay.show {
    opacity: 1;
    visibility: visible;
  }

  /* ── 回收站面板 ── */
  .trash-panel {
    position: fixed;
    top: 0;
    right: 0;
    width: 380px;
    max-width: 90vw;
    height: 100%;
    background: var(--paper);
    z-index: 95;
    display: flex;
    flex-direction: column;
    transform: translateX(100%);
    transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: -4px 0 24px rgba(44,36,22,0.1);
  }

  .trash-panel.show {
    transform: translateX(0);
  }

  .trash-header {
    flex-shrink: 0;
    padding: 1.8rem 1.5rem 1.2rem;
    border-bottom: 1px solid rgba(168,152,128,0.15);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .trash-title {
    font-size: 0.9rem;
    letter-spacing: 0.2em;
    font-weight: 300;
    color: var(--ink);
  }

  .trash-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 1.1rem;
    color: var(--ink-faint);
    padding: 0.2rem 0.4rem;
    border-radius: 4px;
    transition: all 0.2s;
    font-family: inherit;
  }

  .trash-close:hover {
    color: var(--ink);
    background: rgba(168,152,128,0.1);
  }

  .trash-body {
    flex: 1;
    overflow-y: auto;
    padding: 1rem 1.5rem;
  }

  .trash-body::-webkit-scrollbar {
    width: 4px;
  }

  .trash-body::-webkit-scrollbar-thumb {
    background: rgba(168,152,128,0.2);
    border-radius: 2px;
  }

  /* ── 回收站条目 ── */
  .trash-item {
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(168,152,128,0.1);
    border-radius: 4px;
    padding: 1rem 1.2rem;
    margin-bottom: 0.7rem;
    transition: all 0.2s;
  }

  .trash-item:hover {
    background: rgba(255,255,255,0.55);
    border-color: rgba(168,152,128,0.2);
  }

  .trash-item-content {
    font-size: 0.85rem;
    line-height: 1.8;
    color: var(--ink);
    white-space: pre-wrap;
    word-break: break-word;
    margin-bottom: 0.6rem;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .trash-item-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.65rem;
    color: var(--ink-faint);
    letter-spacing: 0.05em;
  }

  .trash-item-expire {
    color: var(--red);
    opacity: 0.7;
  }

  .btn-restore {
    font-family: inherit;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    background: none;
    border: 1px solid rgba(139,105,20,0.25);
    color: var(--accent);
    padding: 0.25rem 0.7rem;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-restore:hover {
    background: rgba(139,105,20,0.08);
    border-color: rgba(139,105,20,0.4);
  }

  .btn-trash-delete {
    font-family: inherit;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    background: none;
    border: 1px solid rgba(158,58,38,0.2);
    color: var(--red);
    padding: 0.25rem 0.7rem;
    border-radius: 3px;
    cursor: pointer;
    transition: all 0.2s;
    opacity: 0.7;
  }

  .btn-trash-delete:hover {
    background: rgba(158,58,38,0.08);
    border-color: rgba(158,58,38,0.4);
    opacity: 1;
  }

  .trash-item-actions {
    display: flex;
    gap: 0.4rem;
    align-items: center;
  }

  .btn-load-more {
    display: block;
    margin: 1.5rem auto 0;
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    padding: 0.5rem 2rem;
    background: none;
    border: 1px solid rgba(168,152,128,0.25);
    color: var(--ink-faint);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-load-more:hover {
    border-color: rgba(139,105,20,0.3);
    color: var(--ink-light);
    background: rgba(255,255,255,0.4);
  }

  /* ── 回收站底部 ── */
  .trash-footer {
    flex-shrink: 0;
    padding: 1rem 1.5rem 1.5rem;
    border-top: 1px solid rgba(168,152,128,0.12);
  }

  .btn-empty-trash {
    width: 100%;
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.12em;
    padding: 0.6rem 1rem;
    background: none;
    border: 1px solid var(--red);
    color: var(--red);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.25s;
    opacity: 0.7;
  }

  .btn-empty-trash:hover {
    background: var(--red);
    color: var(--paper);
    opacity: 1;
  }

  .trash-empty-state {
    text-align: center;
    padding: 4rem 1rem;
    color: var(--ink-faint);
  }

  .trash-empty-state .icon {
    font-size: 1.4rem;
    margin-bottom: 0.6rem;
    opacity: 0.2;
  }

  .trash-empty-state p {
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    font-weight: 300;
  }

  /* ── 确认弹窗 ── */
  .confirm-dialog {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    visibility: hidden;
    transition: all 0.2s;
  }

  .confirm-dialog.show {
    opacity: 1;
    visibility: visible;
  }

  .confirm-dialog .backdrop {
    position: absolute;
    inset: 0;
    background: rgba(44,36,22,0.3);
  }

  .confirm-dialog .dialog-box {
    position: relative;
    background: var(--paper);
    border: 1px solid rgba(168,152,128,0.2);
    border-radius: 6px;
    padding: 2rem 2.2rem;
    box-shadow: 0 8px 32px rgba(44,36,22,0.15);
    text-align: center;
    max-width: 320px;
    transform: scale(0.95);
    transition: transform 0.2s;
  }

  .confirm-dialog.show .dialog-box {
    transform: scale(1);
  }

  .confirm-dialog p {
    font-size: 0.85rem;
    color: var(--ink);
    margin-bottom: 1.5rem;
    letter-spacing: 0.05em;
    line-height: 1.8;
  }

  .confirm-actions {
    display: flex;
    gap: 0.8rem;
    justify-content: center;
  }

  .btn-confirm-cancel {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    padding: 0.45rem 1.4rem;
    background: none;
    border: 1px solid rgba(168,152,128,0.3);
    color: var(--ink-light);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-confirm-cancel:hover {
    border-color: rgba(168,152,128,0.5);
    background: rgba(168,152,128,0.05);
  }

  .btn-confirm-ok {
    font-family: inherit;
    font-size: 0.78rem;
    letter-spacing: 0.1em;
    padding: 0.45rem 1.4rem;
    background: var(--red);
    border: none;
    color: var(--paper);
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.2s;
  }

  .btn-confirm-ok:hover {
    opacity: 0.85;
  }

  /* ── 响应式：小屏上下布局 ── */
  @media (max-width: 768px) {
    body {
      flex-direction: column;
    }

    .left-panel {
      width: 100%;
      padding: 1.5rem 1.2rem;
      border-right: none;
      border-bottom: 1px solid rgba(168,152,128,0.15);
      flex: 0 0 auto;
    }

    .input-section {
      min-height: 0;
    }

    textarea {
      min-height: 60px;
    }

    .left-footer {
      display: none;
    }

    .right-panel {
      flex: 1;
      min-height: 0;
    }

    .tabs-header {
      padding: 0.6rem 1.2rem 0;
    }

    .display-header {
      padding: 1rem 1.2rem 0.5rem;
    }

    .filter-bar {
      flex-wrap: wrap;
    }

    .search-input {
      width: 100px;
    }

    .search-input:focus {
      width: 140px;
    }

    .display-area {
      padding: 0 1.2rem 2rem;
    }
  }
</style>
</head>
<body>

<div class="left-panel">
  <header>
    <h1>碎 片</h1>
    <p class="subtitle">记录此刻所想</p>
  </header>

  <div class="input-section">
    <div class="input-wrapper">
      <textarea id="input" placeholder="写下什么..." maxlength="2000" autofocus></textarea>
      <div class="input-footer">
        <span class="input-hint">⌘ + Enter 提交</span>
        <button class="btn-submit" id="submitBtn">记 下</button>
      </div>
    </div>
  </div>

  <div class="left-footer">碎片 · 用文字留住时光</div>
</div>

<div class="right-panel">
  <div class="tabs-header" id="tabsHeader">
    <div class="tabs-container" id="tabsContainer">
      <button class="tab-item active" data-category-id="">全部</button>
    </div>
    <button class="btn-add-tab" id="btnAddTab" title="添加分类">+</button>
    <button class="btn-ai" id="btnAi" title="AI 分析">✦</button>
    <button class="btn-settings" id="btnSettings" title="设置">⚙</button>
  </div>
  <div class="display-header">
    <div class="display-header-top">
      <div class="display-title-row">
        <span class="display-title" id="aiDisplayTitle">搜 索</span>
        <span class="ai-text" id="aiText"></span>
      </div>
      <div class="filter-bar">
        <button class="btn-ai-regen" id="btnAiRegen" style="display:none;" title="重新生成分析">✦</button>
        <input type="text" class="search-input" id="searchInput" placeholder="搜索碎片...">
        <div class="filter-colors" id="filterColors">
          <button class="filter-color-dot filter-all active" data-filter="" title="全部"></button>
        </div>
        <label class="ai-toggle" id="aiCatToggle" title="AI 分析开关" style="display:none;">
          <input type="checkbox" id="aiCatToggleInput">
          <span class="ai-toggle-slider"></span>
        </label>
      </div>
    </div>
  </div>
  <div class="display-area" id="displayArea">
    <div class="fragments-list" id="list"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<button class="trash-btn" id="trashBtn" title="回收站">
  <span>♻</span>
  <span class="badge" id="trashBadge">0</span>
</button>

<div class="trash-overlay" id="trashOverlay"></div>

<div class="trash-panel" id="trashPanel">
  <div class="trash-header">
    <span class="trash-title">回 收 站</span>
    <button class="trash-close" id="trashClose">✕</button>
  </div>
  <div class="trash-body" id="trashBody"></div>
  <div class="trash-footer">
    <button class="btn-empty-trash" id="btnEmptyTrash">清空回收站</button>
  </div>
</div>

<div class="confirm-dialog" id="confirmDialog">
  <div class="backdrop"></div>
  <div class="dialog-box">
    <p>确定要清空回收站吗？<br>此操作不可撤销</p>
    <div class="confirm-actions">
      <button class="btn-confirm-cancel" id="confirmCancel">取消</button>
      <button class="btn-confirm-ok" id="confirmOk">确定清空</button>
    </div>
  </div>
</div>

<div class="settings-overlay" id="settingsOverlay"></div>
<div class="settings-panel" id="settingsPanel">
  <div class="settings-header">
    <span class="settings-title">设 置</span>
    <button class="settings-close" id="settingsClose">✕</button>
  </div>
  <div class="settings-body" id="settingsBody"></div>
</div>

<div class="delete-cat-dialog" id="deleteCatDialog">
  <div class="backdrop"></div>
  <div class="dialog-box">
    <p id="deleteCatText">确定要删除分类吗？</p>
    <p class="dialog-sub">该分类下有 <strong id="deleteCatCount">0</strong> 条碎片</p>
    <div class="delete-cat-actions">
      <button class="btn-keep" id="deleteCatKeep">保留碎片（移回全部）</button>
      <button class="btn-delete-all" id="deleteCatDeleteAll">一并删除碎片</button>
      <button class="btn-cancel-cat" id="deleteCatCancel">取消</button>
    </div>
  </div>
</div>

<script>
const AUTH_TOKEN_KEY = 'fragments_auth_token';

function getAuthToken() { return sessionStorage.getItem(AUTH_TOKEN_KEY) || ''; }
function setAuthToken(t) { sessionStorage.setItem(AUTH_TOKEN_KEY, t); }

async function authFetch(url, opts = {}) {
  opts.headers = { ...opts.headers, 'X-Auth-Token': getAuthToken() };
  const res = await fetch(url, opts);
  if (res.status === 401) { showLogin(); throw new Error('未授权'); }
  return res;
}

function showLogin() {
  let overlay = document.getElementById('loginOverlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'loginOverlay';
    overlay.innerHTML = `
      <div style="position:fixed;inset:0;background:rgba(245,240,232,0.95);z-index:999;display:flex;align-items:center;justify-content:center;">
        <div style="text-align:center;">
          <div style="font-size:1.6rem;letter-spacing:0.3em;color:#2c2416;margin-bottom:2rem;font-weight:300;">碎 片</div>
          <input id="loginPassword" type="password" placeholder="请输入密码" style="font-family:inherit;font-size:0.85rem;padding:0.6rem 1rem;border:1px solid rgba(168,152,128,0.3);border-radius:4px;background:rgba(255,255,255,0.6);color:#2c2416;outline:none;width:200px;text-align:center;letter-spacing:0.1em;" />
          <br><br>
          <button id="loginBtn" style="font-family:inherit;font-size:0.8rem;letter-spacing:0.1em;padding:0.5rem 2rem;background:#8b6914;border:none;color:#f5f0e8;border-radius:4px;cursor:pointer;">进入</button>
          <div id="loginError" style="margin-top:1rem;font-size:0.75rem;color:#9e3a26;display:none;"></div>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    const btn = document.getElementById('loginBtn');
    const pwInput = document.getElementById('loginPassword');
    const doLogin = async () => {
      const pw = pwInput.value.trim();
      if (!pw) return;
      btn.textContent = '...';
      btn.disabled = true;
      try {
        const res = await authFetch('/api/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: pw })
        });
        const data = await res.json();
        if (data.ok) {
          setAuthToken(data.token || 'ok');
          overlay.remove();
checkAuthAndInit();
        } else {
          document.getElementById('loginError').textContent = '密码错误';
          document.getElementById('loginError').style.display = '';
          btn.textContent = '进入';
          btn.disabled = false;
        }
      } catch {
        document.getElementById('loginError').textContent = '连接失败';
        document.getElementById('loginError').style.display = '';
        btn.textContent = '进入';
        btn.disabled = false;
      }
    };
    btn.addEventListener('click', doLogin);
    pwInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
    pwInput.focus();
  }
}

async function checkAuthAndInit() {
  try {
    const res = await authFetch('/api/auth', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Auth-Token': getAuthToken() },
      body: JSON.stringify({ password: '' })
    });
    if (res.status === 401) { showLogin(); return; }
    init();
  } catch {
    init();
  }
}

const input = document.getElementById('input');
const submitBtn = document.getElementById('submitBtn');
const listEl = document.getElementById('list');
const toastEl = document.getElementById('toast');
const displayArea = document.getElementById('displayArea');
const searchInput = document.getElementById('searchInput');
const filterColorsEl = document.getElementById('filterColors');
const tabsContainer = document.getElementById('tabsContainer');
const btnAddTab = document.getElementById('btnAddTab');

const PAGE_SIZE = 30;
let allFragments = [];
let allCategories = [];
let displayedCount = 0;
let activeFilter = '';
let searchText = '';
let activeCategoryId = localStorage.getItem('activeCategoryId') || '';

// ── 颜色配置 ──
const COLORS = [
  { name: '米白', dot: '#e0d5c0', bg: 'rgba(245,240,232,0.8)' },
  { name: '暖黄', dot: '#d4b86e', bg: 'rgba(236,218,170,0.45)' },
  { name: '淡绿', dot: '#8ca57a', bg: 'rgba(181,196,168,0.4)' },
  { name: '淡紫', dot: '#a590a8', bg: 'rgba(197,179,200,0.4)' }
];

// ── 初始化颜色筛选圆点 ──
COLORS.forEach(c => {
  const dot = document.createElement('button');
  dot.className = 'filter-color-dot';
  dot.dataset.filter = c.bg;
  dot.style.background = c.dot;
  dot.title = c.name;
  filterColorsEl.appendChild(dot);
});

// ── 筛选逻辑 ──
function getFilteredFragments() {
  return allFragments.filter(f => {
    if (activeCategoryId) {
      if (f.category_id !== activeCategoryId) return false;
    } else {
      if (f.category_id) return false;
    }
    if (activeFilter && f.color !== activeFilter) return false;
    if (searchText && !f.content.toLowerCase().includes(searchText)) return false;
    return true;
  });
}

function renderList(reset) {
  if (reset) {
    displayedCount = 0;
    listEl.innerHTML = '';
  }
  const filtered = getFilteredFragments();
  const toShow = filtered.slice(displayedCount, displayedCount + PAGE_SIZE);

  if (displayedCount === 0 && filtered.length === 0) {
    listEl.innerHTML = `
      <div class="empty-state">
        <div class="icon">◇</div>
        <p>${searchText || activeFilter || activeCategoryId ? '没有匹配的碎片' : '还没有碎片，写下第一句吧'}</p>
      </div>
    `;
    removeLoadMore();
    return;
  }

  toShow.forEach((f, i) => {
    const card = createCard(f);
    card.style.animationDelay = `${i * 0.03}s`;
    listEl.appendChild(card);
  });

  displayedCount += toShow.length;

  if (displayedCount < filtered.length) {
    showLoadMore(filtered.length - displayedCount);
  } else {
    removeLoadMore();
  }
}

function showLoadMore(remaining) {
  removeLoadMore();
  const btn = document.createElement('button');
  btn.className = 'btn-load-more';
  btn.id = 'loadMoreBtn';
  btn.textContent = `加载更多 (${remaining})`;
  btn.onclick = () => {
    const filtered = getFilteredFragments();
    const toShow = filtered.slice(displayedCount, displayedCount + PAGE_SIZE);
    toShow.forEach((f, i) => {
      const card = createCard(f);
      card.style.animationDelay = `${i * 0.03}s`;
      listEl.appendChild(card);
    });
    displayedCount += toShow.length;
    const newRemaining = filtered.length - displayedCount;
    if (newRemaining > 0) {
      btn.textContent = `加载更多 (${newRemaining})`;
    } else {
      btn.remove();
    }
  };
  listEl.parentElement.appendChild(btn);
}

function removeLoadMore() {
  const old = document.getElementById('loadMoreBtn');
  if (old) old.remove();
}

searchInput.addEventListener('input', (e) => {
  searchText = e.target.value.trim().toLowerCase();
  renderList(true);
});

filterColorsEl.addEventListener('click', (e) => {
  const dot = e.target.closest('.filter-color-dot');
  if (!dot) return;
  filterColorsEl.querySelectorAll('.filter-color-dot').forEach(d => d.classList.remove('active'));
  dot.classList.add('active');
  activeFilter = dot.dataset.filter;
  renderList(true);
});

// ── 提交 ──
input.addEventListener('keydown', (e) => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
    e.preventDefault();
    submit();
  }
});

submitBtn.addEventListener('click', submit);

async function submit() {
  const content = input.value.trim();
  if (!content) return;

  submitBtn.disabled = true;
  submitBtn.textContent = '...';

  try {
    const res = await authFetch('/api/fragments', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content, category_id: activeCategoryId })
    });

    if (!res.ok) throw new Error('提交失败');

    const fragment = await res.json();
    input.value = '';

    allFragments.unshift(fragment);
    const shouldInsert = !searchText && !activeFilter && fragment.category_id === activeCategoryId;
    if (shouldInsert) {
      const card = createCard(fragment);
      const empty = listEl.querySelector('.empty-state');
      if (empty) empty.remove();
      listEl.insertBefore(card, listEl.firstChild);
      displayedCount++;
    }
    updateCount();
    showToast('已记录');
    displayArea.scrollTo({ top: 0, behavior: 'smooth' });
  } catch (err) {
    showToast('记录失败');
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = '记 下';
  }
}

function createCard(fragment) {
  const card = document.createElement('div');
  card.className = 'fragment-card';
  card.dataset.id = fragment.id;
  card.style.animationDelay = '0s';
  if (fragment.color) card.style.backgroundColor = fragment.color;

  const dotsHtml = COLORS.map(c =>
    `<button class="color-dot${fragment.color === c.bg ? ' active' : ''}" data-color="${c.bg}" style="background:${c.dot}" title="${c.name}"></button>`
  ).join('');

  const catName = fragment.category_id ? (allCategories.find(c => c.id === fragment.category_id)?.name || '') : '';
  const catTagHtml = (catName && !activeCategoryId) ? `<span class="fragment-category-tag">${escapeHtml(catName)}</span>` : '';

  card.innerHTML = `
    <div class="color-dots">${dotsHtml}</div>
    <div class="fragment-content">${escapeHtml(fragment.content)}</div>
    <div class="fragment-meta">
      ${catTagHtml}
      <span class="fragment-time">${formatTime(fragment.created_at)}</span>
      <div class="fragment-actions">
        <button class="btn-category" onclick="event.stopPropagation(); openCategoryDropdown(event, '${fragment.id}', this)">分类</button>
        <div class="category-dropdown" id="catDrop-${fragment.id}"></div>
        <button class="btn-edit" onclick="event.stopPropagation(); editFragment('${fragment.id}', this)">编辑</button>
        <button class="dropdown-trigger" onclick="event.stopPropagation(); toggleDropdown(event, this)">▾</button>
        <div class="dropdown-menu">
          <button class="dropdown-item" onclick="deleteFragment('${fragment.id}', this)">删除</button>
        </div>
      </div>
    </div>
  `;

  return card;
}

function updateCardCategoryTag(card, categoryId) {
  const existing = card.querySelector('.fragment-category-tag');
  if (existing) existing.remove();
  if (!categoryId || activeCategoryId) return;
  const cat = allCategories.find(c => c.id === categoryId);
  if (!cat) return;
  const tag = document.createElement('span');
  tag.className = 'fragment-category-tag';
  tag.textContent = cat.name;
  card.querySelector('.fragment-meta').insertAdjacentElement('afterbegin', tag);
}

async function openCategoryDropdown(e, fragmentId, btn) {
  e.stopPropagation();
  closeAllDropdowns();

  document.querySelectorAll('.fragment-card').forEach(c => c.style.zIndex = '');

  const card = btn.closest('.fragment-card');
  if (card) card.style.zIndex = '30';

  const drop = document.getElementById(`catDrop-${fragmentId}`);
  if (!drop) return;

  try {
    const res = await authFetch('/api/categories');
    allCategories = await res.json();
  } catch {}

  const f = allFragments.find(f => f.id === fragmentId);
  const currentId = f ? (f.category_id || '') : '';

  let html = `<button class="category-dropdown-item${!currentId ? ' active' : ''}" data-cat-id="">无分类</button>`;
  allCategories.forEach(c => {
    html += `<button class="category-dropdown-item${c.id === currentId ? ' active' : ''}" data-cat-id="${c.id}">${escapeHtml(c.name)}</button>`;
  });
  drop.innerHTML = html;
  drop.classList.add('show');

  drop.onclick = (ev) => {
    ev.stopPropagation();
    const item = ev.target.closest('.category-dropdown-item');
    if (!item) return;
    selectCategory(fragmentId, item.dataset.catId);
  };
}

function selectCategory(fragmentId, categoryId) {
  closeAllDropdowns();

  authFetch(`/api/fragments/${fragmentId}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ category_id: categoryId })
  }).then(res => {
    if (!res.ok) throw new Error();
    const f = allFragments.find(f => f.id === fragmentId);
    if (f) f.category_id = categoryId;

    renderList(true);

    showToast('分类已更新');
  }).catch(() => {
    showToast('更新失败');
  });
}

async function deleteFragment(id, btn) {
  const card = btn.closest('.fragment-card');
  closeAllDropdowns();
  if (card.classList.contains('editing')) return;
  card.classList.add('removing');
  await authFetch(`/api/fragments/${id}`, { method: 'DELETE' });
  setTimeout(() => {
    card.remove();
    allFragments = allFragments.filter(f => f.id !== id);
    displayedCount = Math.max(0, displayedCount - 1);
    updateCount();
    loadTrashCount();
    showToast('已移入回收站');
  }, 300);
}

// ── 编辑碎片 ──

function editFragment(id, btn) {
  const card = btn.closest('.fragment-card');
  if (card.classList.contains('editing')) return;
  card.classList.add('editing');

  const contentEl = card.querySelector('.fragment-content');
  const originalText = contentEl.textContent;

  const textarea = document.createElement('textarea');
  textarea.className = 'edit-textarea';
  textarea.value = originalText;
  textarea.maxLength = 2000;
  contentEl.replaceWith(textarea);
  textarea.focus();

  textarea.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      saveFragment(id, card, textarea);
    }
  });

  btn.textContent = '保存';
  btn.className = 'btn-save';
  btn.onclick = () => saveFragment(id, card, textarea);

  const dropdown = card.querySelector('.dropdown-trigger');
  dropdown.textContent = '✕';
  dropdown.style.opacity = '0.6';
  dropdown.onclick = (e) => { e.stopPropagation(); cancelEdit(card, textarea, originalText); };

  const menu = card.querySelector('.dropdown-menu');
  menu.style.display = 'none';
}

async function saveFragment(id, card, textarea) {
  const content = textarea.value.trim();
  if (!content) { showToast('内容不能为空'); return; }

  try {
    const res = await authFetch(`/api/fragments/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ content })
    });
    if (!res.ok) throw new Error();
    const fragment = await res.json();

    const contentDiv = document.createElement('div');
    contentDiv.className = 'fragment-content';
    contentDiv.textContent = fragment.content;
    textarea.replaceWith(contentDiv);

    const f = allFragments.find(f => f.id === id);
    if (f) f.content = fragment.content;

    resetEditState(card);
    showToast('已保存');
  } catch {
    showToast('保存失败');
  }
}

function cancelEdit(card, textarea, originalText) {
  const contentDiv = document.createElement('div');
  contentDiv.className = 'fragment-content';
  contentDiv.textContent = originalText;
  textarea.replaceWith(contentDiv);
  resetEditState(card);
}

function resetEditState(card) {
  card.classList.remove('editing');

  const editBtn = card.querySelector('.btn-save');
  if (editBtn) {
    editBtn.textContent = '编辑';
    editBtn.className = 'btn-edit';
    editBtn.onclick = () => editFragment(card.dataset.id, editBtn);
  }

  const dropdown = card.querySelector('.dropdown-trigger');
  dropdown.textContent = '▾';
  dropdown.style.opacity = '';
  dropdown.onclick = (e) => toggleDropdown(e, dropdown);

  const menu = card.querySelector('.dropdown-menu');
  menu.style.display = '';
}

function toggleDropdown(e, trigger) {
  e.stopPropagation();
  const menu = trigger.nextElementSibling;
  const isOpen = menu.classList.contains('show');
  closeAllDropdowns();
  if (!isOpen) menu.classList.add('show');
}

function closeAllDropdowns() {
  document.querySelectorAll('.dropdown-menu.show').forEach(m => m.classList.remove('show'));
  document.querySelectorAll('.category-dropdown.show').forEach(m => m.classList.remove('show'));
  document.querySelectorAll('.fragment-card').forEach(c => c.style.zIndex = '');
}

document.addEventListener('click', closeAllDropdowns);

// ── 点击卡片复制内容 ──
listEl.addEventListener('click', async (e) => {
  const card = e.target.closest('.fragment-card');
  if (!card || card.classList.contains('editing')) return;
  if (e.target.closest('.fragment-actions') || e.target.closest('.color-dots')) return;

  const content = card.querySelector('.fragment-content');
  if (!content) return;

  try {
    await navigator.clipboard.writeText(content.textContent);
    showToast('已复制');
  } catch {
    const ta = document.createElement('textarea');
    ta.value = content.textContent;
    ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    showToast('已复制');
  }
});

function updateCount() {
  const filtered = getFilteredFragments();
  if (filtered.length === 0 && !searchText && !activeFilter && !activeCategoryId) {
    if (!listEl.querySelector('.empty-state')) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">◇</div>
          <p>还没有碎片，写下第一句吧</p>
        </div>
      `;
    }
  }
}

function formatTime(datetime) {
  if (!datetime) return '';
  const d = new Date(datetime.replace(' ', 'T'));
  const now = new Date();
  const diff = now - d;
  const minutes = Math.floor(diff / 60000);
  const hours = Math.floor(diff / 3600000);

  if (minutes < 1) return '刚刚';
  if (minutes < 60) return `${minutes} 分钟前`;
  if (hours < 24) return `${hours} 小时前`;

  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  const h = String(d.getHours()).padStart(2, '0');
  const min = String(d.getMinutes()).padStart(2, '0');

  if (y === now.getFullYear()) return `${m}月${day}日 ${h}:${min}`;
  return `${y}年${m}月${day}日 ${h}:${min}`;
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  setTimeout(() => toastEl.classList.remove('show'), 1500);
}

// ── 颜色圆点点击（使用 color key 比较）──
listEl.addEventListener('click', (e) => {
  const dot = e.target.closest('.color-dot');
  if (!dot) return;
  e.stopPropagation();

  const card = dot.closest('.fragment-card');
  const id = card.dataset.id;
  const color = dot.dataset.color;

  card.querySelectorAll('.color-dot').forEach(d => d.classList.remove('active'));

  const f = allFragments.find(f => f.id === id);
  const prevColor = f ? f.color : '';
  const isSame = prevColor === color;
  const newColor = isSame ? '' : color;

  if (!isSame) dot.classList.add('active');
  card.style.backgroundColor = newColor;

  if (f) f.color = newColor;

  authFetch(`/api/fragments/${id}`, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ color: newColor })
  });
});

// ── 拖拽排序 ──
const dragState = { el: null, timer: null, startY: 0 };

listEl.addEventListener('mousedown', (e) => {
  const card = e.target.closest('.fragment-card');
  if (!card || card.classList.contains('editing') || e.target.closest('.color-dots') || e.target.closest('.fragment-actions')) return;
  dragState.startY = e.clientY;
  dragState.timer = setTimeout(() => startDrag(card, e.clientY), 500);
  dragState.el = card;
});

listEl.addEventListener('touchstart', (e) => {
  const card = e.target.closest('.fragment-card');
  if (!card || card.classList.contains('editing') || e.target.closest('.color-dots') || e.target.closest('.fragment-actions')) return;
  dragState.startY = e.touches[0].clientY;
  dragState.timer = setTimeout(() => startDrag(card, e.touches[0].clientY), 500);
  dragState.el = card;
}, { passive: true });

document.addEventListener('mousemove', (e) => {
  if (!dragState.el) return;
  if (dragState.timer && Math.abs(e.clientY - dragState.startY) > 8) { cancelDrag(); return; }
  if (dragState.dragging) moveDrag(e.clientY);
});

document.addEventListener('touchmove', (e) => {
  if (!dragState.el) return;
  if (dragState.timer && Math.abs(e.touches[0].clientY - dragState.startY) > 8) { cancelDrag(); return; }
  if (dragState.dragging) { e.preventDefault(); moveDrag(e.touches[0].clientY); }
}, { passive: false });

document.addEventListener('mouseup', endDrag);
document.addEventListener('touchend', endDrag);

function startDrag(card, y) {
  dragState.dragging = true;
  dragState.timer = null;
  const rect = card.getBoundingClientRect();
  dragState.offsetY = y - rect.top;
  dragState.height = rect.height;
  dragState.origPrev = card.previousElementSibling;

  card.classList.add('dragging');
  card.style.position = 'fixed';
  card.style.left = rect.left + 'px';
  card.style.top = rect.top + 'px';
  card.style.width = rect.width + 'px';
  card.style.zIndex = '150';
  card.style.pointerEvents = 'none';

  document.body.style.userSelect = 'none';
}

function moveDrag(y) {
  const card = dragState.el;
  card.style.top = (y - dragState.offsetY) + 'px';

  const siblings = [...listEl.querySelectorAll('.fragment-card:not(.dragging)')];
  siblings.forEach(s => s.classList.remove('drop-before', 'drop-after'));

  let closest = null, minDist = Infinity;
  siblings.forEach(s => {
    const r = s.getBoundingClientRect();
    const mid = r.top + r.height / 2;
    const dist = Math.abs(y - mid);
    if (dist < minDist) { minDist = dist; closest = s; }
  });

  if (closest) {
    const r = closest.getBoundingClientRect();
    closest.classList.add(y < r.top + r.height / 2 ? 'drop-before' : 'drop-after');
  }
}

function endDrag() {
  if (dragState.timer) { cancelDrag(); return; }
  if (!dragState.dragging) return;

  const card = dragState.el;
  const target = listEl.querySelector('.drop-before, .drop-after');

  if (target) {
    if (target.classList.contains('drop-before')) {
      listEl.insertBefore(card, target);
    } else {
      listEl.insertBefore(card, target.nextSibling);
    }
    target.classList.remove('drop-before', 'drop-after');
  }

  card.style.position = '';
  card.style.left = '';
  card.style.top = '';
  card.style.width = '';
  card.style.zIndex = '';
  card.style.pointerEvents = '';
  card.classList.remove('dragging');
  document.body.style.userSelect = '';

  const ids = [...listEl.querySelectorAll('.fragment-card')].map(c => c.dataset.id);
  authFetch('/api/fragments/reorder', {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ ids })
  });

  dragState.el = null;
  dragState.dragging = false;
}

function cancelDrag() {
  clearTimeout(dragState.timer);
  dragState.timer = null;
  dragState.el = null;
  dragState.dragging = false;
  document.body.style.userSelect = '';
}

// ── 回收站逻辑 ──

const trashBtn = document.getElementById('trashBtn');
const trashBadge = document.getElementById('trashBadge');
const trashOverlay = document.getElementById('trashOverlay');
const trashPanel = document.getElementById('trashPanel');
const trashClose = document.getElementById('trashClose');
const trashBody = document.getElementById('trashBody');
const btnEmptyTrash = document.getElementById('btnEmptyTrash');
const confirmDialog = document.getElementById('confirmDialog');
const confirmCancel = document.getElementById('confirmCancel');
const confirmOk = document.getElementById('confirmOk');

trashBtn.addEventListener('click', openTrashPanel);
trashOverlay.addEventListener('click', closeTrashPanel);
trashClose.addEventListener('click', closeTrashPanel);
btnEmptyTrash.addEventListener('click', () => confirmDialog.classList.add('show'));
confirmCancel.addEventListener('click', () => confirmDialog.classList.remove('show'));
confirmOk.addEventListener('click', emptyTrash);

async function loadTrashCount() {
  try {
    const res = await authFetch('/api/trash');
    const trash = await res.json();
    updateTrashBadge(trash.length);
  } catch {}
}

function updateTrashBadge(count) {
  trashBadge.textContent = count;
  if (count > 0) {
    trashBadge.classList.add('show');
  } else {
    trashBadge.classList.remove('show');
  }
}

async function openTrashPanel() {
  trashOverlay.classList.add('show');
  trashPanel.classList.add('show');
  await renderTrash();
}

function closeTrashPanel() {
  trashOverlay.classList.remove('show');
  trashPanel.classList.remove('show');
}

async function renderTrash() {
  try {
    const res = await authFetch('/api/trash');
    const trash = await res.json();

    if (trash.length === 0) {
      trashBody.innerHTML = `
        <div class="trash-empty-state">
          <div class="icon">◇</div>
          <p>回收站是空的</p>
        </div>
      `;
      btnEmptyTrash.style.display = 'none';
      updateTrashBadge(0);
      return;
    }

    btnEmptyTrash.style.display = '';
    updateTrashBadge(trash.length);

    trashBody.innerHTML = trash.map(item => {
      const daysLeft = getDaysLeft(item.deleted_at);
      return `
        <div class="trash-item" data-id="${item.id}">
          <div class="trash-item-content">${escapeHtml(item.content)}</div>
          <div class="trash-item-footer">
            <span class="trash-item-expire">${daysLeft} 天后过期</span>
            <div class="trash-item-actions">
              <button class="btn-restore" onclick="restoreFragment('${item.id}')">恢复</button>
              <button class="btn-trash-delete" onclick="permanentDelete('${item.id}')">删除</button>
            </div>
          </div>
        </div>
      `;
    }).join('');
  } catch {
    trashBody.innerHTML = '<div class="trash-empty-state"><p>加载失败</p></div>';
  }
}

function getDaysLeft(deletedAt) {
  const deleted = new Date(deletedAt.replace(' ', 'T')).getTime();
  const elapsed = Date.now() - deleted;
  const remaining = 3 * 24 * 60 * 60 * 1000 - elapsed;
  return Math.max(0, Math.ceil(remaining / (24 * 60 * 60 * 1000)));
}

async function restoreFragment(id) {
  try {
    const res = await authFetch(`/api/trash/${id}/restore`, { method: 'POST' });
    if (!res.ok) throw new Error();
    const fragment = await res.json();

    allFragments.unshift(fragment);
    const shouldInsert = !searchText && !activeFilter && fragment.category_id === activeCategoryId;
    if (shouldInsert) {
      const card = createCard(fragment);
      const empty = listEl.querySelector('.empty-state');
      if (empty) empty.remove();
      listEl.insertBefore(card, listEl.firstChild);
      displayedCount++;
    }
    updateCount();

    await renderTrash();
    showToast('已恢复');
  } catch {
    showToast('恢复失败');
  }
}

async function permanentDelete(id) {
  try {
    await authFetch(`/api/trash/${id}`, { method: 'DELETE' });
    await renderTrash();
    showToast('已永久删除');
  } catch {
    showToast('删除失败');
  }
}

async function emptyTrash() {
  confirmDialog.classList.remove('show');
  try {
    await authFetch('/api/trash', { method: 'DELETE' });
    updateTrashBadge(0);
    await renderTrash();
    showToast('已清空');
  } catch {
    showToast('清空失败');
  }
}

// ── 页签管理 ──

function renderTabs() {
  tabsContainer.innerHTML = '';
  const allTab = document.createElement('button');
  allTab.className = 'tab-item';
  allTab.dataset.categoryId = '';
  allTab.textContent = '全部';
  if (!activeCategoryId) allTab.classList.add('active');
  tabsContainer.appendChild(allTab);

  allCategories.forEach(cat => {
    const tab = document.createElement('button');
    tab.className = 'tab-item';
    tab.dataset.categoryId = cat.id;

    const nameSpan = document.createElement('span');
    nameSpan.textContent = cat.name;
    tab.appendChild(nameSpan);

    if (cat.id === activeCategoryId) {
      tab.classList.add('active');
    }
    tabsContainer.appendChild(tab);
  });
}

function switchTab(categoryId) {
  activeCategoryId = categoryId;
  localStorage.setItem('activeCategoryId', categoryId);
  tabsContainer.querySelectorAll('.tab-item').forEach(tab => {
    tab.classList.toggle('active', tab.dataset.categoryId === categoryId);
  });
  renderList(true);
}

async function loadCategories() {
  try {
    const res = await authFetch('/api/categories');
    allCategories = await res.json();
    if (activeCategoryId && !allCategories.find(c => c.id === activeCategoryId)) {
      activeCategoryId = '';
      localStorage.setItem('activeCategoryId', '');
      renderTabs();
      renderList(true);
      return;
    }
    renderTabs();
  } catch (err) {
    showToast('加载分类失败');
  }
}

tabsContainer.addEventListener('click', (e) => {
  const tab = e.target.closest('.tab-item');
  if (tab && !tab.classList.contains('tab-item-editing')) {
    switchTab(tab.dataset.categoryId);
  }
});

btnAddTab.addEventListener('click', () => {
  const existingInput = tabsContainer.querySelector('.tab-input');
  if (existingInput) return;

  const input = document.createElement('input');
  input.className = 'tab-input';
  input.placeholder = '分类名称';
  input.maxLength = 20;
  tabsContainer.appendChild(input);
  input.focus();

  let submitting = false;

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      if (!submitting) {
        submitting = true;
        createCategory(input.value.trim());
      }
    } else if (e.key === 'Escape') {
      input.remove();
    }
  });

  input.addEventListener('blur', () => {
    if (submitting) return;
    if (input.value.trim()) {
      submitting = true;
      createCategory(input.value.trim());
    } else {
      input.remove();
    }
  });
});

async function createCategory(name) {
  if (!name) return;
  try {
    const res = await authFetch('/api/categories', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    if (!res.ok) throw new Error();
    const category = await res.json();
    allCategories.push(category);
    renderTabs();
    switchTab(category.id);
    showToast('分类已创建');
  } catch {
    showToast('创建失败');
  }
}

tabsContainer.addEventListener('dblclick', (e) => {
  const tab = e.target.closest('.tab-item');
  if (!tab || !tab.dataset.categoryId) return;

  const originalName = tab.querySelector('span')?.textContent || tab.textContent;
  tab.classList.add('tab-item-editing');

  const renameInput = document.createElement('input');
  renameInput.className = 'tab-rename-input';
  renameInput.value = originalName;
  renameInput.maxLength = 20;
  tab.innerHTML = '';
  tab.appendChild(renameInput);
  renameInput.focus();
  renameInput.select();

  renameInput.addEventListener('keydown', (ev) => {
    if (ev.key === 'Enter') {
      ev.preventDefault();
      renameCategory(tab.dataset.categoryId, renameInput.value.trim(), tab, originalName);
    } else if (ev.key === 'Escape') {
      tab.textContent = originalName;
      tab.classList.remove('tab-item-editing');
    }
  });

  renameInput.addEventListener('blur', () => {
    const newName = renameInput.value.trim();
    if (newName && newName !== originalName) {
      renameCategory(tab.dataset.categoryId, newName, tab, originalName);
    } else {
      tab.textContent = originalName;
      tab.classList.remove('tab-item-editing');
    }
  });
});

async function renameCategory(id, newName, tab, originalName) {
  if (!newName) {
    tab.textContent = originalName;
    tab.classList.remove('tab-item-editing');
    return;
  }
  try {
    const res = await authFetch(`/api/categories/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: newName })
    });
    if (!res.ok) throw new Error();
    const category = await res.json();
    const cat = allCategories.find(c => c.id === id);
    if (cat) cat.name = category.name;
    renderTabs();
    showToast('已重命名');
  } catch {
    renderTabs();
    showToast('重命名失败');
  }
}

// ── 删除分类 ──

let deleteCatTargetId = null;

async function deleteCategory(id, keepFragments) {
  try {
    const url = keepFragments
      ? `/api/categories/${id}?keep=1`
      : `/api/categories/${id}`;
    const res = await authFetch(url, { method: 'DELETE' });
    if (!res.ok) throw new Error();
    allCategories = allCategories.filter(c => c.id !== id);
    if (activeCategoryId === id) {
      activeCategoryId = '';
      localStorage.setItem('activeCategoryId', '');
    }
    if (keepFragments) {
      allFragments.forEach(f => { if (f.category_id === id) f.category_id = ''; });
    } else {
      allFragments = allFragments.filter(f => f.category_id !== id);
    }
    renderTabs();
    renderList(true);
    renderSettings();
    showToast('分类已删除');
  } catch {
    showToast('删除失败');
  }
}

// ── 设置面板 ──

const settingsOverlay = document.getElementById('settingsOverlay');
const settingsPanel = document.getElementById('settingsPanel');
const settingsClose = document.getElementById('settingsClose');
const settingsBody = document.getElementById('settingsBody');
const btnSettings = document.getElementById('btnSettings');

const deleteCatDialog = document.getElementById('deleteCatDialog');
const deleteCatCount = document.getElementById('deleteCatCount');
const deleteCatKeep = document.getElementById('deleteCatKeep');
const deleteCatDeleteAll = document.getElementById('deleteCatDeleteAll');
const deleteCatCancel = document.getElementById('deleteCatCancel');

btnSettings.addEventListener('click', openSettings);
settingsOverlay.addEventListener('click', closeSettings);
settingsClose.addEventListener('click', closeSettings);

function openSettings() {
  settingsOverlay.classList.add('show');
  settingsPanel.classList.add('show');
  renderSettings();
}

function closeSettings() {
  settingsOverlay.classList.remove('show');
  settingsPanel.classList.remove('show');
}

function renderSettings() {
  if (allCategories.length === 0) {
    settingsBody.innerHTML = '<div class="settings-empty">暂无分类</div>';
    return;
  }
  settingsBody.innerHTML = `<div class="settings-section-title">分 类 管 理</div>` + allCategories.map(cat => {
    const count = allFragments.filter(f => f.category_id === cat.id).length;
    return `
      <div class="settings-category-item">
        <div>
          <span class="settings-category-name">${escapeHtml(cat.name)}</span>
          <span class="settings-category-count">${count} 条</span>
        </div>
        <button class="settings-category-delete" onclick="confirmDeleteCategory('${cat.id}', ${count})">删除</button>
      </div>
    `;
  }).join('');
}

function confirmDeleteCategory(id, count) {
  deleteCatTargetId = id;
  deleteCatCount.textContent = count;
  deleteCatDialog.classList.add('show');
}

deleteCatKeep.addEventListener('click', () => {
  deleteCatDialog.classList.remove('show');
  if (deleteCatTargetId) deleteCategory(deleteCatTargetId, true);
  deleteCatTargetId = null;
});

deleteCatDeleteAll.addEventListener('click', () => {
  deleteCatDialog.classList.remove('show');
  if (deleteCatTargetId) deleteCategory(deleteCatTargetId, false);
  deleteCatTargetId = null;
});

deleteCatCancel.addEventListener('click', () => {
  deleteCatDialog.classList.remove('show');
  deleteCatTargetId = null;
});

async function loadFragments() {
  try {
    const res = await authFetch('/api/fragments');
    allFragments = await res.json();
    renderList(true);
  } catch (err) {
    showToast('加载失败');
  }
}

// ── AI 功能 ──

const aiTextEl = document.getElementById('aiText');
const aiDisplayTitle = document.getElementById('aiDisplayTitle');
const aiCatToggle = document.getElementById('aiCatToggle');
const aiCatToggleInput = document.getElementById('aiCatToggleInput');
const btnAi = document.getElementById('btnAi');
const btnAiRegen = document.getElementById('btnAiRegen');

let aiCache = {};
let aiGenerating = false;

function getAiToggles() {
  try { return JSON.parse(localStorage.getItem('aiToggles') || '{}'); } catch { return {}; }
}

function setAiToggles(toggles) {
  localStorage.setItem('aiToggles', JSON.stringify(toggles));
}

function isAiEnabled(catId) {
  const toggles = getAiToggles();
  return !!toggles[catId || 'all'];
}

function setAiEnabled(catId, enabled) {
  const toggles = getAiToggles();
  toggles[catId || 'all'] = enabled;
  setAiToggles(toggles);
}

function getAiCacheKey(catId) {
  return `ai_cache_${catId || 'all'}`;
}

function loadAiCache(catId) {
  try { return localStorage.getItem(getAiCacheKey(catId)) || ''; } catch { return ''; }
}

function saveAiCache(catId, text) {
  try { localStorage.setItem(getAiCacheKey(catId), text); } catch {}
}

function clearAllAiCache() {
  const keys = [];
  for (let i = 0; i < localStorage.length; i++) {
    const key = localStorage.key(i);
    if (key && key.startsWith('ai_cache_')) keys.push(key);
  }
  keys.forEach(k => localStorage.removeItem(k));
}

function updateAiDisplay() {
  const catId = activeCategoryId;
  const enabled = isAiEnabled(catId);
  const cached = loadAiCache(catId);

  aiCatToggle.style.display = '';
  aiCatToggleInput.checked = enabled;
  btnAiRegen.style.display = enabled ? '' : 'none';

  if (cached && enabled) {
    aiDisplayTitle.textContent = '';
    aiTextEl.textContent = cached;
    aiTextEl.style.opacity = '';
    aiTextEl.style.display = '';
  } else if (enabled) {
    aiDisplayTitle.textContent = '';
    aiTextEl.textContent = '点击 ✦ 开始分析';
    aiTextEl.style.opacity = '0.4';
    aiTextEl.style.display = '';
  } else {
    const frags = catId ? allFragments.filter(f => f.category_id === catId) : allFragments;
    const today = new Date().toISOString().slice(0, 10);
    const todayCount = frags.filter(f => f.created_at && f.created_at.startsWith(today)).length;
    const totalCount = frags.length;
    aiDisplayTitle.textContent = `共 ${totalCount} 条记录`;
    aiTextEl.textContent = todayCount > 0 ? `今日新增 ${todayCount} 条` : '暂无今日记录';
    aiTextEl.style.opacity = '0.5';
    aiTextEl.style.display = '';
  }
}

async function callAi(content, catName) {
  const res = await authFetch('/api/ai', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ content, catName })
  });

  if (!res.ok) throw new Error('AI API error');
  const data = await res.json();
  return data.result || '';
}

async function generateAiForCategory(catId, catName) {
  const frags = allFragments.filter(f => catId ? f.category_id === catId : !f.category_id);
  if (frags.length === 0) {
    saveAiCache(catId, '暂无足够内容');
    return;
  }
  const content = frags.map(f => f.content).join('\n');
  const result = await callAi(content, catName);
  if (result) {
    saveAiCache(catId, result);
  }
}

async function generateAllAi() {
  if (aiGenerating) return;
  aiGenerating = true;
  btnAi.classList.add('loading');

  try {
    clearAllAiCache();

    const enabledCats = [];
    if (isAiEnabled('all')) {
      const noCatFrags = allFragments.filter(f => !f.category_id);
      if (noCatFrags.length > 0) enabledCats.push({ id: '', name: '全部' });
    }
    allCategories.forEach(cat => {
      if (isAiEnabled(cat.id)) {
        enabledCats.push({ id: cat.id, name: cat.name });
      }
    });

    for (const cat of enabledCats) {
      try {
        await generateAiForCategory(cat.id, cat.name);
      } catch {}
    }

    updateAiDisplay();
    showToast('AI 分析完成');
  } catch {
    showToast('AI 分析失败');
  } finally {
    aiGenerating = false;
    btnAi.classList.remove('loading');
  }
}

btnAi.addEventListener('click', generateAllAi);

async function generateCurrentCategoryAi() {
  if (aiGenerating) return;
  aiGenerating = true;
  btnAiRegen.classList.add('loading');

  try {
    const catId = activeCategoryId;
    const catName = catId ? allCategories.find(c => c.id === catId)?.name : '全部';
    await generateAiForCategory(catId, catName);
    updateAiDisplay();
    showToast('AI 分析完成');
  } catch {
    showToast('AI 分析失败');
  } finally {
    aiGenerating = false;
    btnAiRegen.classList.remove('loading');
  }
}

btnAiRegen.addEventListener('click', generateCurrentCategoryAi);

aiCatToggleInput.addEventListener('change', () => {
  setAiEnabled(activeCategoryId, aiCatToggleInput.checked);
  updateAiDisplay();
});

const origSwitchTab = switchTab;
switchTab = function(categoryId) {
  origSwitchTab(categoryId);
  updateAiDisplay();
};

const origRenderSettings = renderSettings;
renderSettings = function() {
  origRenderSettings();
  if (allCategories.length > 0) {
    settingsBody.innerHTML += renderAiSettings();
  }
};

function renderAiSettings() {
  const allEnabled = isAiEnabled('all');
  let html = `<div class="settings-ai-section">
    <div class="settings-section-title">A I 分 析</div>
    <div class="settings-ai-item">
      <span class="settings-ai-label">全局 AI 分析</span>
      <label class="ai-toggle">
        <input type="checkbox" ${allEnabled ? 'checked' : ''} onchange="setAiEnabled('all', this.checked)">
        <span class="ai-toggle-slider"></span>
      </label>
    </div>`;

  allCategories.forEach(cat => {
    const enabled = isAiEnabled(cat.id);
    html += `<div class="settings-ai-item">
      <span class="settings-ai-label">${escapeHtml(cat.name)}</span>
      <label class="ai-toggle">
        <input type="checkbox" ${enabled ? 'checked' : ''} onchange="setAiEnabled('${cat.id}', this.checked)">
        <span class="ai-toggle-slider"></span>
      </label>
    </div>`;
  });

  html += `</div>`;
  return html;
}

async function init() {
  await loadCategories();
  await loadFragments();
  loadTrashCount();
  updateAiDisplay();
}

init();
</script>
